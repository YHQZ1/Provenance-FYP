global:
  domain: argocd.localhost

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 180s

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 768Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
