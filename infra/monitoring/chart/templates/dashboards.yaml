{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "provenance-dashboard-%s" (base $path | trimSuffix ".json") }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: provenance-monitoring
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
