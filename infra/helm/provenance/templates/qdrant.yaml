{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    {{- include "provenance.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "provenance.selector" (dict "name" "qdrant" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.config.QDRANT_PORT }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    {{- include "provenance.labels" . | nindent 4 }}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "provenance.selector" (dict "name" "qdrant" "root" .) | nindent 6 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "provenance.selector" (dict "name" "qdrant" "root" .) | nindent 8 }}
        {{- include "provenance.labels" . | nindent 8 }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "provenance.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
{{- end }}
