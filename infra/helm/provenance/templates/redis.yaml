{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "provenance.labels" . | nindent 4 }}
    provenance/metrics: "true"
spec:
  selector:
    {{- include "provenance.selector" (dict "name" "redis" "root" .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
    - name: metrics
      port: 9121
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "provenance.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "provenance.selector" (dict "name" "redis" "root" .) | nindent 6 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "provenance.selector" (dict "name" "redis" "root" .) | nindent 8 }}
        {{- include "provenance.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        - name: exporter
          image: {{ .Values.redis.exporter.image }}
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 59000
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.redis.exporter.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "provenance.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
{{- end }}
