# Canonical local runtime compose for the repository.
# Run from the repo root with:
#   docker compose -f infra/docker-compose.yaml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: provenance-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: provenance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  rag-classify:
    build:
      context: ../apps/rag-classify
    container_name: provenance-rag-classify
    env_file:
      - ../apps/rag-classify/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - model_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  model_cache:
