name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  plan:
    name: Plan
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing: ${{ steps.plan.outputs.missing }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: python3 .github/scripts/images.py plan

  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ matrix.image }}:${{ matrix.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

  manifest:
    name: Multi-architecture manifests
    needs: [plan, build]
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: python3 .github/scripts/images.py manifest --services '${{ needs.plan.outputs.missing }}'

  tags:
    name: Record the image tags
    needs: [plan, build, manifest]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.manifest.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - run: python3 source/.github/scripts/images.py values --output "$GITHUB_WORKSPACE/main/infra/helm/provenance/values-images.yaml"
        working-directory: source
      - name: Commit the tags
        working-directory: main
        run: |
          if git diff --quiet -- infra/helm/provenance/values-images.yaml; then
            echo "tags unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/provenance/values-images.yaml
          git commit -m "chore(images): update the image tags [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
