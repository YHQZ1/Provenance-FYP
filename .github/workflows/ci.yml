name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-app:
    name: Web app · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: http://api.example.test
          VITE_SITE_URL: http://app.example.test

  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend-service/package-lock.json
      - run: npm ci
      - run: npm test

  ocr-service:
    name: OCR service · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest httpx python-multipart==0.0.20 pymupdf==1.24.14 pdf2image==1.17.0 Pillow==11.1.0 opencv-python-headless==4.10.0.84 numpy==1.26.4 pydantic==2.10.6 fastapi==0.115.6 prometheus-client==0.21.1
      - run: python -m pytest tests/unit -q
        env:
          PYTHONPATH: src

  rag-classify:
    name: Classifier · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rag-classify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest httpx==0.25.2 tenacity==8.2.3 pydantic==2.5.3 pydantic-settings==2.1.0 fastapi==0.109.0 prometheus-client==0.21.1
      - run: python -m pytest tests -q

  rag-regulatory:
    name: Regulatory RAG · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rag-regulatory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest httpx==0.25.2 fastapi==0.110.0 prometheus-client==0.21.1
      - run: python -m pytest tests -q
      - run: python -m compileall -q src scripts

  e2e:
    name: End-to-end · sign up to export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/backend-service/package-lock.json
            apps/web-app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci
        working-directory: apps/backend-service
      - run: npm ci
        working-directory: apps/web-app
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-app
      - run: supabase start
      - name: Point the tests at the local stack
        run: sh apps/web-app/e2e/stack-env.sh >> "$GITHUB_ENV"
      - run: npx playwright test
        working-directory: apps/web-app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web-app/playwright-report
            apps/web-app/test-results
          retention-days: 7

  helm-chart:
    name: Helm chart · lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint infra/helm/provenance -f infra/helm/provenance/values-local.yaml
      - run: helm template provenance infra/helm/provenance -f infra/helm/provenance/values-local.yaml > /dev/null
      - run: |
          helm template provenance infra/helm/provenance -f infra/helm/provenance/values-local.yaml --set jobs.ingest.force=true --set jobs.ingest.onUpgrade=true > /dev/null
      - run: helm template provenance infra/helm/provenance -f infra/helm/provenance/values-local.yaml -f infra/helm/provenance/values-images.yaml -f infra/helm/provenance/values-gitops.yaml > /dev/null
      - run: python3 .github/scripts/images.py values > /dev/null
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
      - run: helm lint infra/monitoring/chart
      - run: python3 -m pip install --quiet pyyaml
      - run: infra/monitoring/check-rules.sh
