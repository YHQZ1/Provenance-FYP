[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-ocr-service"
version = "0.1.0"
description = "OCR and invoice extraction service for Provenance"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
